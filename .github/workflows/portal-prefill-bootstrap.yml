name: Portal prefill patch

on:
  push:
    branches:
      - claude/velto-customer-portal

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/velto-customer-portal
      - name: Patch existing booking form without forking backend
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/components/forms/BookingForm.tsx")
          s = p.read_text()
          s = s.replace("  presetNote,\n  previewOutcome,", "  presetNote,\n  prefill,\n  previewOutcome,")
          s = s.replace("  presetNote?: string;\n  /** Development-only", "  presetNote?: string;\n  /** Safe account fields loaded server-side. Customer still confirms and submits. */\n  prefill?: { sector?: string; address?: string; name?: string; phone?: string };\n  /** Development-only")
          s = s.replace('    sector: "",', '    sector: prefill?.sector ?? "",')
          s = s.replace('    address: "",', '    address: prefill?.address ?? "",')
          s = s.replace('    name: "",', '    name: prefill?.name ?? "",')
          s = s.replace('    phone: "",', '    phone: prefill?.phone ?? "",')
          if "prefill?:" not in s or 'sector: prefill?.sector' not in s:
              raise SystemExit("booking prefill patch did not apply")
          p.write_text(s)
          for temp in [Path(".github/workflows/portal-lock-bootstrap.yml"), Path(".github/workflows/portal-prefill-bootstrap.yml")]:
              if temp.exists(): temp.unlink()
      - name: Commit final patch and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/forms/BookingForm.tsx .github/workflows
          git commit -m "feat: prefill booking from customer account"
          git push origin HEAD:claude/velto-customer-portal
