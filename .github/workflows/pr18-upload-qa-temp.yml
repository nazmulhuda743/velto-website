name: PR18 upload QA temp

on:
  push:
    branches:
      - claude/vibrant-ptolemy-3t7ulo

permissions:
  contents: read

jobs:
  upload-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-run image upload QA
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const store = fs.readFileSync('src/lib/admin/content-store.ts', 'utf8');
          const limits = fs.readFileSync('src/lib/admin/upload-limits.ts', 'utf8');
          const input = fs.readFileSync('src/components/admin/ImageFileInput.tsx', 'utf8');
          const images = fs.readFileSync('src/app/admin/(panel)/images/page.tsx', 'utf8');
          const seo = fs.readFileSync('src/app/admin/(panel)/seo/edit/page.tsx', 'utf8');

          assert.match(limits, /MAX_UPLOAD_BYTES\s*=\s*4\s*\*\s*1024\s*\*\s*1024/);
          assert.match(limits, /MAX_UPLOAD_LABEL\s*=\s*["']4 MB["']/);
          assert.match(store, /file\.size === 0 \|\| file\.size > MAX_UPLOAD_BYTES/);
          assert.doesNotMatch(store, /TYPES\[file\.type\]/);
          assert.match(input, /file\.size > MAX_UPLOAD_BYTES/);
          assert.match(input, /setCustomValidity\(message\)/);
          assert.match(images, /<ImageFileInput name="image"/);
          assert.match(seo, /<ImageFileInput name="ogImage"/);

          const match = store.match(/function sniffImageType\(head: Buffer\): string \| null \{([\s\S]*?)\n\}/);
          assert(match, 'sniffImageType source not found');
          const body = match[1].replace(/: number/g, '');
          const source = `function sniffImageType(head) {${body}\n}; return sniffImageType;`;
          const sniff = new Function('Buffer', source)(Buffer);

          const jpg = Buffer.from([0xff,0xd8,0xff,0x00,0x10]);
          const png = Buffer.from([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a,0,0,0,0]);
          const webp = Buffer.alloc(12); webp.write('RIFF',0,'latin1'); webp.write('WEBP',8,'latin1');
          const avif = Buffer.alloc(12); avif.write('ftyp',4,'latin1'); avif.write('avif',8,'latin1');
          const fakeJpg = Buffer.from('this-is-text-renamed-to-jpg');
          const gif = Buffer.from('GIF89a');

          assert.equal(sniff(jpg), 'image/jpeg');
          assert.equal(sniff(png), 'image/png');
          assert.equal(sniff(webp), 'image/webp');
          assert.equal(sniff(avif), 'image/avif');
          assert.equal(sniff(fakeJpg), null);
          assert.equal(sniff(gif), null);

          console.log('PASS valid JPG');
          console.log('PASS valid PNG');
          console.log('PASS valid WebP');
          console.log('PASS valid AVIF');
          console.log('PASS fake .jpg rejected by bytes');
          console.log('PASS GIF rejected');
          console.log('PASS 4 MB server guard');
          console.log('PASS >4 MB client pre-upload guard');
          console.log('PASS Images page uses guarded picker');
          console.log('PASS SEO share-image uses same guarded picker');
          NODE
